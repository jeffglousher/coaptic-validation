name: Public Xtensa archive
on:
  workflow_dispatch:
    inputs:
      suite_revision:
        description: Full companion commit SHA, selected after PR216 merge
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: coaptic-archive217
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUITE_SHA: ${{ inputs.suite_revision }}
      CORE_SHA: 28d9f1a61d15121d75d5dd426ad8d6b5cc891005
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate immutable input before checkout
        run: |
          python3 -B - <<'PY'
          import os, re, time
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['SUITE_SHA']):
            raise SystemExit('suite_revision must be a full lowercase hex40 SHA')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('ARCHIVE217_DEADLINE='+str(time.time()+2400)+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeffglousher/coaptic
          ref: 28d9f1a61d15121d75d5dd426ad8d6b5cc891005
          path: coaptic
          persist-credentials: false
      - name: Bounded tool setup, archive build and inspection
        id: build
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re, shutil, stat, sys, threading, time, urllib.request
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'coaptic-archive217'
          root.mkdir(exist_ok=False)
          evidence = root / 'evidence'
          evidence.mkdir()
          sys.path.insert(0, str(workspace / 'tools/benchmark'))
          from linux_cpu import run_logged
          MIB = 1024**2
          started = time.monotonic()
          receipt = {'schema': 'coaptic-hosted-archive/1', 'status': 'failed', 'phases': {},
               'qualification': 'Official Linux compiler match; custom ancillary SDK equivalence unproven.',
               'limits': {'owned_bytes': 10*1024**3, 'free_bytes': 1024**3,
                     'log_bytes': 128*1024, 'archive_bytes': 16*MIB, 'artifact_bytes': 32*MIB}}
          cancel = threading.Event()
          done = threading.Event()
          monitor_errors = []
          env = dict(os.environ)
          for key, directory in [('CARGO_HOME', 'cargo'), ('RUSTUP_HOME', 'rustup'),
                     ('CARGO_TARGET_DIR', 'target'), ('TMPDIR', 'tmp')]:
            env[key] = str(root / directory)
            Path(env[key]).mkdir()
          env.update(TMP=env['TMPDIR'], TEMP=env['TMPDIR'], ARCHIVE_ROOT=str(root),
               CARGO_INCREMENTAL='0', CARGO_BUILD_JOBS='2', CARGO_TERM_COLOR='never')
          for key in ('RUSTC', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'RUSTFLAGS',
                'CARGO_ENCODED_RUSTFLAGS', 'RUSTUP_TOOLCHAIN'):
            env.pop(key, None)
          log = (evidence / 'phases.log').open('w+b')
          peak = 0
          downloads = {'espup': 12831320, 'rust.tar.xz': 180366964,
                'rust-src.tar.xz': 6314780,
                'idf_tool_xtensa_elf_clang.libs.tar.xz': 83267264,
                'xtensa-esp-elf.tar.xz': 89005792}
          def measure():
            global peak
            if time.time() >= float(os.environ['ARCHIVE217_DEADLINE']):
              raise TimeoutError('40-minute processing deadline; reserve job cleanup/upload time')
            scan_start = time.monotonic()
            total = count = 0
            for base in (workspace, root):
              for directory, dirs, files in os.walk(base, followlinks=False):
                dirs[:] = [d for d in dirs if not Path(directory, d).is_symlink()]
                for name in files:
                  count += 1
                  if count > 200000 or time.monotonic()-scan_start > 10:
                    raise RuntimeError('owned census capacity/deadline')
                  path = Path(directory, name)
                  try:
                    s = path.lstat()
                  except FileNotFoundError:
                    continue
                  if not stat.S_ISREG(s.st_mode):
                    continue
                  total += max(s.st_size, s.st_blocks*512)
                  key = name.removesuffix('.part')
                  if key in downloads and s.st_size > downloads[key]:
                    raise RuntimeError('tool download file limit: '+name)
                  if name == 'libcoaptic_esphome_probe.a' and s.st_size > 16*MIB:
                    raise RuntimeError('archive file limit')
            peak = max(peak, total)
            if total > 10*1024**3 or any(shutil.disk_usage(p).free < 1024**3 for p in (root, workspace)):
              raise RuntimeError('owned 10GiB ceiling or free 1GiB floor')
          def monitor():
            while not done.is_set():
              try:
                measure()
              except BaseException as error:
                monitor_errors.append(str(error)[:512])
                cancel.set()
                return
              done.wait(.5)
          watcher = threading.Thread(target=monitor, daemon=True)
          def run(phase, argv, timeout, exported=False):
            if cancel.is_set():
              raise RuntimeError('storage monitor refused execution')
            begin = time.monotonic()
            offset = log.tell()
            if exported:
              argv = ['bash', '-eu', '-c', '. "$ARCHIVE_ROOT/export-esp.sh"; exec "$@"', 'archive217', *argv]
            try:
              run_logged(argv, log, timeout=timeout, limit=120*1024, cancel=cancel,
                   cwd=workspace, env=env)
              end = log.tell()
              log.seek(offset)
              result = log.read(end-offset)
              log.seek(end)
              return result.decode('utf-8', errors='strict')
            finally:
              receipt['phases'][phase] = time.monotonic()-begin
          def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()
          def compiler(text):
            fields = dict(line.split(': ', 1) for line in text.splitlines() if ': ' in line)
            expected = {'binary': 'rustc', 'commit-hash': '8ea53bcd7257011cbf96f6398551bdc650b04334',
                  'commit-date': '2026-07-08', 'host': 'x86_64-unknown-linux-gnu',
                  'release': '1.97.0-nightly', 'LLVM version': '21.1.3'}
            if any(fields.get(k) != v for k, v in expected.items()) or '(1.97.0.0)' not in text.splitlines()[0]:
              raise ValueError('compiler identity mismatch')
            return fields
          try:
            measure()
            watcher.start()
            begin = time.monotonic()
            required = ['tools/esphome/build_archive.py', 'tools/qualification/build_source.py',
                  'tools/source_identity.py', 'tools/benchmark/linux_cpu.py',
                  'tools/benchmark/native_lock.py', 'tools/benchmark/native_profiles.py']
            for name in required:
              if not (workspace/name).is_file():
                raise ValueError('missing helper: '+name)
            sys.path.insert(0, str(workspace / 'tools/qualification'))
            from build_source import build_source
            source = build_source(os.environ['CORE_SHA'])
            if source['suite_source'] != os.environ['SUITE_SHA']:
              raise ValueError('actual companion HEAD mismatch')
            receipt['source'] = source
            receipt['helpers'] = {name: digest(workspace/name) for name in required}
            if receipt['helpers']['tools/esphome/build_archive.py'] != '4e370ca6ef5eab372b10ead7576c1f3ecf7d52bcbc134d20fc185c5a5025a3ee':
              raise ValueError('archive helper differs from frozen source')
            receipt['phases']['source_validation'] = time.monotonic()-begin
            begin = time.monotonic()
            installer = root / 'espup'
            url = 'https://github.com/esp-rs/espup/releases/download/v0.19.0/espup-x86_64-unknown-linux-gnu'
            with urllib.request.urlopen(url, timeout=30) as response, installer.open('xb') as output:
              length = response.headers.get('Content-Length')
              if length and int(length) != downloads['espup']:
                raise ValueError('installer content length mismatch')
              size = 0
              while data := response.read(65536):
                size += len(data)
                if size > downloads['espup'] or time.monotonic()-begin > 120 or cancel.is_set():
                  raise RuntimeError('installer download size/time/storage refusal')
                output.write(data)
            if size != downloads['espup'] or digest(installer) != 'f31411c64dffff4da0f0e23c432b9a5fda48942ff8695b8b21009ceb7007bcc0':
              raise ValueError('installer size/SHA256 mismatch')
            installer.chmod(0o700)
            receipt['installer_sha256'] = digest(installer)
            receipt['phases']['installer_download'] = time.monotonic()-begin
            run('tool_setup', [str(installer), 'install', '--name', 'coaptic-esp-1.97',
              '--toolchain-version', '1.97.0.0', '--targets', 'esp32s3',
              '--export-file', str(root/'export-esp.sh')], 900)
            text = run('compiler', ['rustc', '+coaptic-esp-1.97', '-Vv'], 30, True)
            receipt['compiler'] = compiler(text)
            (evidence/'compiler.txt').write_text(text, encoding='utf-8')
            if not (root/'rustup/toolchains/coaptic-esp-1.97/lib/rustlib/src/rust/library/core/Cargo.toml').is_file():
              raise ValueError('espup rust-src component missing')
            run('build', ['python3', '-B', 'tools/esphome/build_archive.py', '--toolchain',
              'coaptic-esp-1.97', '--expected-library-revision', os.environ['CORE_SHA'],
              '--pairing', '--async-network'], 1500, True)
            begin = time.monotonic()
            lib = workspace/'tools/esphome/components/coaptic_network/lib'
            archive, marker = lib/'libcoaptic_esphome_probe.a', lib/'build.json'
            if not 0 < archive.stat().st_size <= 16*MIB or marker.stat().st_size > MIB:
              raise ValueError('archive/metadata file size refusal')
            report = json.loads(marker.read_text())
            if not report.get('sources'):
              raise ValueError('missing source hashes')
            if (report['schema'] != 'coaptic-esphome-archive/3' or
              report['target'] != 'xtensa-esp32s3-none-elf' or
              report['features'] != ['network', 'standalone', 'oscore', 'pairing', 'async-network'] or
              any(report.get(k) != v for k, v in source.items()) or
              build_source(os.environ['CORE_SHA']) != source or
              report['archive_sha256'] != digest(archive) or compiler(report['compiler']) != receipt['compiler']):
              raise ValueError('archive provenance mismatch')
            for name, value in report['sources'].items():
              path = (workspace/name).resolve()
              if not path.is_relative_to(workspace) or digest(path) != value:
                raise ValueError('archive source hash mismatch')
            with archive.open('rb') as stream:
              magic = stream.read(8)
            if magic != b'!<arch>\n':
              raise ValueError('not an ar static archive')
            receipt['archive_sha256'] = digest(archive)
            shutil.copyfile(archive, evidence/archive.name)
            shutil.copyfile(marker, evidence/marker.name)
            receipt['phases']['inspection'] = time.monotonic()-begin
            measure()
            if cancel.is_set():
              raise RuntimeError('storage monitor failed')
            receipt['status'] = 'passed'
          except BaseException as error:
            receipt['error'] = type(error).__name__+': '+str(error)[:1024]
            receipt['error_notes'] = [str(n)[:512] for n in getattr(error, '__notes__', [])[:4]]
            print(receipt['error'])
          finally:
            done.set()
            if watcher.ident is not None:
              watcher.join(12)
            receipt['monitor_errors'] = monitor_errors
            receipt['peak_sampled_owned_bytes'] = peak
            receipt['phases']['total'] = time.monotonic()-started
            receipt['job_elapsed_seconds'] = time.time()-float(os.environ['ARCHIVE217_DEADLINE'])+2400
            if watcher.is_alive() or monitor_errors:
              receipt['status'] = 'failed'
            log.close()
            (evidence/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
            files = list(evidence.iterdir())
            if (sum(p.stat().st_size for p in files) > 32*MIB or
              sum(p.stat().st_size for p in files if p.suffix == '.log') > 128*1024):
              raise SystemExit('artifact byte limit; upload refused')
            if receipt['status'] != 'passed':
              for name in ('libcoaptic_esphome_probe.a', 'build.json'):
                (evidence/name).unlink(missing_ok=True)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('upload=true\n')
          if receipt['status'] != 'passed':
            raise SystemExit(1)
          PY
      - name: Retain bounded archive evidence
        if: ${{ always() && steps.build.outputs.upload == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-xtensa-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/coaptic-archive217/evidence/
          if-no-files-found: error
          retention-days: 1
