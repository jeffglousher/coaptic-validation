name: Suite CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library_revision:
        description: Full Coaptic commit SHA
        default: "7047d0ac5c4d12922a297f012e4c452d03e5bd3f"
        type: string
permissions:
  contents: read
concurrency:
  group: suite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    with:
      suite_revision: ${{ github.sha }}
      library_repository: jeffglousher/coaptic
      library_revision: ${{ inputs.library_revision || '7047d0ac5c4d12922a297f012e4c452d03e5bd3f' }}
