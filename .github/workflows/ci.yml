name: Suite CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library_revision:
        description: Full Coaptic commit SHA
        default: "0d3cfdd40143f6d091acf23afa022c2553b6717a"
        type: string
permissions:
  contents: read
concurrency:
  group: suite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    with:
      suite_revision: ${{ github.sha }}
      library_repository: jeffglousher/coaptic
      library_revision: ${{ inputs.library_revision || '0d3cfdd40143f6d091acf23afa022c2553b6717a' }}
