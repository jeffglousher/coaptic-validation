name: Suite CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library_revision:
        description: Full Coaptic commit SHA
        default: "b953240c9e5cdabe5a889868ac4aeb18456c7bb6"
        type: string
permissions:
  contents: read
concurrency:
  group: suite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    with:
      suite_revision: ${{ github.sha }}
      library_repository: jeffglousher/coaptic
      library_revision: ${{ inputs.library_revision || 'b953240c9e5cdabe5a889868ac4aeb18456c7bb6' }}
