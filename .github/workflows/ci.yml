name: Suite CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library_revision:
        description: Full Coaptic commit SHA
        default: "36adea97d317a317d71e48b51f4b80d464f006b2"
        type: string
permissions:
  contents: read
concurrency:
  group: suite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    with:
      suite_revision: ${{ github.sha }}
      library_repository: jeffglousher/coaptic
      library_revision: ${{ inputs.library_revision || '36adea97d317a317d71e48b51f4b80d464f006b2' }}
