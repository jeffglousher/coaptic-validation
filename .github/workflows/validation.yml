name: Validation
on:
  workflow_call:
    inputs:
      suite_revision:
        required: true
        type: string
      library_repository:
        required: true
        type: string
      library_revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  durable-host:
    name: durable host receipts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/durable-host
      - run: cargo fmt --manifest-path tools/durable-host/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/durable-host/Cargo.toml --all-targets -- -D warnings
      - name: Process termination, refusal and recovery evidence
        shell: bash
        run: |
          rustc -Vv > "$RUNNER_TEMP/durable-host-toolchain.txt"
          cargo -V >> "$RUNNER_TEMP/durable-host-toolchain.txt"
          cargo test --locked --manifest-path tools/durable-host/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/durable-host-tests.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: durable-host-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/durable-host-tests.log
            ${{ runner.temp }}/durable-host-toolchain.txt
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  protected-container:
    name: protected Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python3 tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - run: python3 -m unittest discover -s tools/qualification -p 'test_container_host.py'
      - run: python3 tools/qualification/container_host.py --output "$RUNNER_TEMP/protected-container"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: protected-linux-container
          path: |
            ${{ runner.temp }}/protected-container/
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  host-platforms:
    name: host library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python -m unittest discover -s tools/qualification -p "test_*.py"
      - run: python tools/qualification/host.py --output "${{ runner.temp }}/host-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-qualification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/host-qualification.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  host-32bit:
    name: 32-bit library (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: python -m unittest discover -s tools/qualification -p "test_*.py"
      - run: python tools/qualification/host.py --target "${{ matrix.target }}" --output "${{ runner.temp }}/host-32bit.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-32bit-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/host-32bit.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  big-endian:
    name: big-endian library (emulated s390x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          targets: s390x-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: s390x-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-s390x-linux-gnu libc6-dev-s390x-cross
      - run: python3 -m unittest discover -s tools/qualification -p 'test_*.py'
      - run: python3 tools/qualification/host.py --target s390x-unknown-linux-gnu --output "${{ runner.temp }}/big-endian.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: big-endian-s390x
          path: |
            ${{ runner.temp }}/big-endian.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  source-coverage:
    name: source coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: llvm-tools
      - run: python3 -m unittest discover -s tools/qualification -p 'test_*.py'
      - run: python3 tools/qualification/coverage.py --work-root "${{ runner.temp }}/coverage-build" --output "${{ runner.temp }}/coverage/source-coverage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-coverage
          path: |
            ${{ runner.temp }}/coverage/
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  branch-coverage:
    name: source branch coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-01
          components: llvm-tools
      - run: python3 -m unittest discover -s tools/qualification -p 'test_*.py'
      - run: python3 tools/qualification/coverage.py --branches --work-root "${{ runner.temp }}/coverage-build" --output "${{ runner.temp }}/coverage/source-coverage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: branch-coverage
          path: |
            ${{ runner.temp }}/coverage/
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  coverage-guided-fuzz:
    name: coverage-guided fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
      - run: python3 -m unittest discover -s tools/qualification -p 'test_*.py'
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: python3 tools/qualification/fuzz.py --seconds 10 --output target/fuzz-evidence/fuzz.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fuzz-smoke
          path: |
            target/fuzz-evidence/
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  cross-build:
    name: no_std code generation (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv6m-none-eabi, thumbv7em-none-eabi, riscv32imac-unknown-none-elf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: python3 tools/qualification/cross_build.py --target ${{ matrix.target }} --output ${{ runner.temp }}/cross-build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cross-build-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cross-build.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  seeded-qualification:
    name: seeded qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
      - run: python3 tools/qualification/seeded.py --output ${{ runner.temp }}/seeded.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: seeded-qualification
          path: |
            ${{ runner.temp }}/seeded.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error

  process-interop:
    name: independent process interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Pin independent C peer source
        run: |
          git init "$RUNNER_TEMP/libcoap"
          git -C "$RUNNER_TEMP/libcoap" fetch --depth 1 https://github.com/obgm/libcoap.git 851533c3cf63d16984d370ce39d586ecb3694971
          git -C "$RUNNER_TEMP/libcoap" checkout --detach FETCH_HEAD
      - name: Build separate peer executables
        run: |
          cargo clippy --locked -p peer-coaptic -p peer-coap-rs --all-targets -- -D warnings
          cargo test --locked -p peer-coaptic -p peer-coap-rs
          cargo build --locked --release -p peer-coaptic -p peer-coap-rs
          cmake -S tools/interop/libcoap -B target/libcoap-peer -G Ninja -DLIBCOAP_SOURCE="$RUNNER_TEMP/libcoap" -DCMAKE_BUILD_TYPE=Release -DENABLE_DTLS=ON -DDTLS_BACKEND=openssl -DENABLE_OSCORE=ON
          cmake --build target/libcoap-peer --parallel 2
      - name: Supervisor and fault-injection tests
        run: python3 -m unittest discover -s tools/interop -p 'test_*.py'
      - name: Wire interoperability, reliability and timing
        run: python3 tools/interop/run.py --coaptic target/release/peer-coaptic --coap-rs target/release/peer-coap-rs --libcoap target/libcoap-peer/peer-libcoap --iterations 100 --build-note "all peers Release; Ubuntu hosted runner" --output target/process-interop.json
      - name: Retain measurements and fault evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-interop
          path: |
            target/process-interop.json
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: warn
  plugtest:
    name: App plugtest and dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p coaptic-plugtest --all-targets --features dtls,oscore -- -D warnings
      - run: cargo test --locked -p coaptic-plugtest --features dtls,oscore
        env:
          COAPTIC_OBSERVE_CAPTURE_DIR: ${{ runner.temp }}/observe-captures
      - run: cargo run --locked -p coaptic-plugtest --bin dogfood -- --iterations 2 --compare crates/coaptic-plugtest/baselines/dogfood.json
      - run: cargo run --locked -p coaptic-plugtest --features oscore --bin dogfood -- --oscore --iterations 2 --compare crates/coaptic-plugtest/baselines/dogfood-oscore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: observe-notifications
          path: |
            ${{ runner.temp }}/observe-captures/
            ${{ runner.temp }}/validation-source.json
          if-no-files-found: error
  esphome-configuration:
    name: Custom ESPHome source and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi
      - name: Verify source and prepare pinned path dependencies
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - run: python -m pip install esphome==2026.9.1
      - run: python -m unittest discover -s tools/esphome -p 'test_*.py'
      - run: cargo fmt --manifest-path tools/esphome/rust/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/esphome/rust/Cargo.toml --all-targets --features network,oscore,host,telemetry -- -D warnings
      - run: cargo test --locked --manifest-path tools/esphome/rust/Cargo.toml --features network,oscore,host,telemetry
      - run: cargo check --locked --manifest-path tools/esphome/rust/Cargo.toml --target thumbv7em-none-eabi --lib --no-default-features --features network,telemetry,library-only
  supervisor-tests:
    name: Validation runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/coaptic-validation
          ref: ${{ inputs.suite_revision }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.library_repository }}
          ref: ${{ inputs.library_revision }}
          path: coaptic
          persist-credentials: false
      - name: Verify source and prepare pinned path dependencies
        shell: bash
        env:
          LIBRARY_REVISION: ${{ inputs.library_revision }}
        run: python tools/prepare.py --expected-revision "$LIBRARY_REVISION" --output "$RUNNER_TEMP/validation-source.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m unittest discover -s tools/qualification -p 'test_*.py'
      - run: python -m unittest discover -s tools/interop -p 'test_*.py'
      - run: python -m unittest discover -s tools/benchmark -p 'test_*.py'
      - run: python -m unittest discover -s tools/security-profile -p 'test_*.py'
      - run: python -m unittest discover -s tools/provisioning -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check diagnostic profiler
        run: |
          cargo fmt --manifest-path tools/benchmark/native/Cargo.toml -p bench-profile -- --check
          cargo clippy --locked --manifest-path tools/benchmark/native/Cargo.toml -p bench-profile --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/benchmark/native/Cargo.toml -p bench-profile
