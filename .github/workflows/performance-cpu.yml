name: Manual Linux process CPU and perf qualification

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Immutable full baseline core SHA (hex40)
        required: true
        type: string
        default: b8f44fa16b3e16f4c9c6cc5f1205d2aee9cb0b57
      candidate_sha:
        description: Immutable full candidate core SHA (hex40)
        required: true
        type: string
      sizes:
        description: Profile-supported response bytes (host-control 64,1024,65536; see guide)
        type: string
        default: 64,1024
      resource_profile:
        description: Same exact resource profile on both labels; new profiles require Mio C1 CON
        type: choice
        default: host-control
        options: [host-control, small-device, small-blockwise, service-fixed, service-allocated]
      rates:
        description: One to three paced complete operations/s (campaign bounds enforced)
        type: string
        default: 100,1000
      seconds:
        description: Clean window scheduled seconds (2..30)
        type: number
        default: 10
      repeats:
        description: Rotated clean pairs (2..8)
        type: number
        default: 4
      server_kind:
        description: Same host adapter for both core revisions
        type: choice
        default: coaptic-reusable
        options: [coaptic-reusable, coaptic-mio, coaptic-ready, coaptic-async, coaptic-blocking, coaptic-staged-ready, coaptic-staged-mio, coaptic-mio-direct, all]
      candidate_server_kind:
        description: Same adapter, or explicit scheduling comparison requiring identical core SHAs
        type: choice
        default: same
        options: [same, coaptic-reusable, coaptic-mio, coaptic-ready, coaptic-async, coaptic-blocking, coaptic-staged-ready, coaptic-staged-mio, coaptic-mio-direct]
      perf:
        description: Additional bounded perf record and stat passes (permission refusal retained)
        type: boolean
        default: true
      admission_diagnostics:
        description: Local admission intervals; identical core/adapter and C1 required, perf must be false, CPU ratios vetoed
        type: boolean
        default: false
      client_concurrency:
        description: Outstanding client Calls (2..4 requires explicit non; CON NSTART=1)
        type: choice
        default: '1'
        options: ['1', '2', '3', '4']
      message_type:
        description: Explicit CoAP request type; concurrent NON is a separate cohort
        type: choice
        default: con
        options: [con, non]

permissions:
  contents: read
concurrency:
  group: manual-linux-cpu
  cancel-in-progress: false

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RESPONSE_SIZES: ${{ inputs.sizes }}
      RESOURCE_PROFILE: ${{ inputs.resource_profile }}
      OFFERED_RATES: ${{ inputs.rates }}
      WINDOW_SECONDS: ${{ inputs.seconds }}
      REPEATS: ${{ inputs.repeats }}
      SERVER_KIND: ${{ inputs.server_kind }}
      CANDIDATE_SERVER_KIND: ${{ inputs.candidate_server_kind }}
      PERF_ENABLED: ${{ inputs.perf }}
      ADMISSION_DIAGNOSTICS: ${{ inputs.admission_diagnostics }}
      CLIENT_CONCURRENCY: ${{ inputs.client_concurrency }}
      MESSAGE_TYPE: ${{ inputs.message_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable inputs and every clean/profile plan before setup
        run: |
          mkdir -p "$RUNNER_TEMP/cpu-setup-logs"
          python3 - <<'PY' >"$RUNNER_TEMP/cpu-setup-logs/input-validation.log" 2>&1
          import argparse, os, sys
          sys.path.insert(0, 'tools/benchmark')
          from linux_cpu import configuration, sha40
          sha40(os.environ['BASELINE_SHA'])
          sha40(os.environ['CANDIDATE_SHA'])
          configuration(argparse.Namespace(
              sizes=os.environ['RESPONSE_SIZES'], rates=os.environ['OFFERED_RATES'],
              resource_profile=os.environ['RESOURCE_PROFILE'],
              seconds=int(os.environ['WINDOW_SECONDS']), repeats=int(os.environ['REPEATS']),
              server_kind=os.environ['SERVER_KIND'], perf=os.environ['PERF_ENABLED'] == 'true',
              admission_diagnostics=os.environ['ADMISSION_DIAGNOSTICS'] == 'true',
              candidate_server_kind=(None if os.environ['CANDIDATE_SERVER_KIND'] == 'same'
                                     else os.environ['CANDIDATE_SERVER_KIND']),
              baseline_sha=os.environ['BASELINE_SHA'], candidate_sha=os.environ['CANDIDATE_SHA'],
              concurrency=int(os.environ['CLIENT_CONCURRENCY']), message_type=os.environ['MESSAGE_TYPE']))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: jeffglousher/coaptic
          ref: ${{ inputs.baseline_sha }}
          path: coaptic
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: clippy
      - name: Python checks and one runner build lane
        env:
          COAPTIC_PRIVILEGED_CLEANUP_TESTS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/cpu-build-lane" "$RUNNER_TEMP/cpu-setup-logs"
          python3 -m venv "$RUNNER_TEMP/cpu-venv"
          "$RUNNER_TEMP/cpu-venv/bin/pip" install 'psutil==7.0.0' >"$RUNNER_TEMP/cpu-setup-logs/python.log" 2>&1
          "$RUNNER_TEMP/cpu-venv/bin/python" -m unittest discover -s tools/benchmark -p 'test_linux*.py'
          "$RUNNER_TEMP/cpu-venv/bin/python" -m unittest discover -s tools/benchmark -p 'test_native_diagnostic.py'
          PYTHONPATH=tools/benchmark "$RUNNER_TEMP/cpu-venv/bin/python" -B -m unittest \
            test_core_cost_probe test_perf_sampling_probe test_native_lock
          # Never change perf_event_paranoid or install a kernel/profiling service.
          # Missing perf/sudo, unsupported events and permission refusal are raw artifacts.
          { command -v perf; perf --version; command -v prlimit; uname -a; } >"$RUNNER_TEMP/cpu-setup-logs/perf-tools.log" 2>&1 || true
      - name: Direct Linux transport proof before its comparison
        if: inputs.server_kind == 'coaptic-mio-direct' || inputs.candidate_server_kind == 'coaptic-mio-direct'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cpu-build-lane
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
          RUSTC: rustc
        run: |
          PYTHONPATH=tools/benchmark python3 -B - <<'PY'
          import os
          from pathlib import Path
          from linux_cpu import SUITE, identity, run_logged, save
          from native_lock import native_lock
          before = identity(SUITE), identity(SUITE / 'coaptic')
          if any(source['status'] for source in before):
              raise ValueError('direct preflight requires clean sources')
          logs = Path(os.environ['RUNNER_TEMP']) / 'cpu-setup-logs'
          with native_lock(SUITE / 'coaptic') as lock_input:
              for name, command in (
                  ('direct-tests', ['cargo', 'test', '--manifest-path', 'tools/benchmark/native/Cargo.toml',
                                   '--release', '--locked', '-p', 'bench-rust-server', '--bin',
                                   'bench-rust-server', 'direct_udp::tests']),
                  ('direct-clippy', ['cargo', 'clippy', '--manifest-path', 'tools/benchmark/native/Cargo.toml',
                                    '--release', '--locked', '-p', 'bench-rust-server', '--bin',
                                    'bench-rust-server', '--', '-D', 'warnings'])):
                  with (logs / (name + '.log')).open('wb') as log:
                      run_logged(command, log, cwd=SUITE, timeout=900)
          if (identity(SUITE), identity(SUITE / 'coaptic')) != before:
              raise ValueError('direct preflight source identity changed')
          save(logs / 'direct-lock-input.json', dict(suite=before[0], core=before[1], native_lock_input=lock_input))
          PY
      - name: Sequential source-matched builds, clean windows, then profiling
        run: |
          options=()
          if [[ "$PERF_ENABLED" == true ]]; then options+=(--perf); fi
          if [[ "$ADMISSION_DIAGNOSTICS" == true ]]; then options+=(--admission-diagnostics); fi
          if [[ "$CANDIDATE_SERVER_KIND" != same ]]; then options+=(--candidate-server-kind "$CANDIDATE_SERVER_KIND"); fi
          "$RUNNER_TEMP/cpu-venv/bin/python" tools/benchmark/linux_cpu.py \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --build-lane "$RUNNER_TEMP/cpu-build-lane" --output "$RUNNER_TEMP/cpu-evidence" \
            --sizes "$RESPONSE_SIZES" --rates "$OFFERED_RATES" \
            --resource-profile "$RESOURCE_PROFILE" \
            --seconds "$WINDOW_SECONDS" --repeats "$REPEATS" --server-kind "$SERVER_KIND" \
            --concurrency "$CLIENT_CONCURRENCY" --message-type "$MESSAGE_TYPE" \
            "${options[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpu-evidence
            ${{ runner.temp }}/cpu-setup-logs
          if-no-files-found: warn
          retention-days: 14
