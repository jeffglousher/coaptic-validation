name: Manual bounded admission wall screen

on:
  workflow_call:
    inputs:
      contract:
        description: Explicit frozen wall screen contract
        type: string
        default: admission
      proof_only:
        description: Run ownership proof with measurements NOT RUN
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      contract:
        description: Explicit frozen wall screen contract
        type: choice
        options: [admission, dedup-classified, borrowed-dedup-retirement, admission-stage-b]
        default: admission
      proof_only:
        description: Run ownership proof with measurements NOT RUN
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: admission-wall-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      WALL_CONTRACT: ${{ inputs.contract }}
      PROOF_ONLY: ${{ inputs.proof_only }}
      SUITE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the fixed hosted source plan
        shell: pwsh
        run: |
          if ($env:WALL_CONTRACT -cne 'borrowed-dedup-retirement' -and $env:WALL_CONTRACT -cne 'admission-stage-b' -and $env:WALL_CONTRACT -cnotin @('admission', 'dedup-classified')) { throw 'Unknown wall contract' }
          if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement' -and $env:PROOF_ONLY -ceq 'true') { throw 'Borrowed dedup retirement refuses proof' }
          if ($env:WALL_CONTRACT -ceq 'dedup-classified' -and $env:PROOF_ONLY -ceq 'true') { throw 'Dedup refuses proof' }
          $root = if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement') { 'coaptic-borrowed-dedup-retirement-wall' } elseif ($env:WALL_CONTRACT -ceq 'admission-stage-b') { 'coaptic-admission-stage-b' } elseif ($env:WALL_CONTRACT -ceq 'dedup-classified') { 'coaptic-dedup-classified-wall' } else { 'coaptic-admission-wall' }
          $prefix = if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement') { 'borrowed-dedup-retirement-wall-screen' } elseif ($env:WALL_CONTRACT -ceq 'admission-stage-b') { 'admission-stage-b' } elseif ($env:WALL_CONTRACT -ceq 'dedup-classified') { 'dedup-classified-wall-screen' } else { 'admission-wall-screen' }
          $baseline = if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement') { 'c655b3aac485c3b88d3811b4da836b56210fce5b' } else { '623c82db1a6606ec86cd56bb52009988b9f0d87e' }
          "WALL_BASELINE=$baseline" >> $env:GITHUB_ENV
          "WALL_ROOT=$root" >> $env:GITHUB_ENV
          "WALL_ARTIFACT=$prefix" >> $env:GITHUB_ENV
          if ($env:PROOF_ONLY -cnotin @('true', 'false')) { throw 'Strict proof_only boolean required' }
          if ($env:SUITE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Immutable suite SHA required' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Dedicated hosted runner required' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeffglousher/coaptic
          ref: ${{ env.WALL_BASELINE }}
          path: coaptic
          persist-credentials: false
      - name: Fetch only the immutable candidate
        shell: pwsh
        run: |
          $expected = if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement') { '34d1af4511f8acaedbb8ad1556638646bf238fca' } elseif ($env:WALL_CONTRACT -ceq 'dedup-classified') { '8f1f138c825f431149ed8a0a7eefbb6be6cb1b6a' } else { '8782a6a0b0aef2facf51bec884cfe37f2a80f28d' }
          git -C coaptic fetch --no-tags --depth=1 origin $expected
          if ($LASTEXITCODE) { throw 'Candidate fetch failed' }
          $candidate = git -C coaptic rev-parse FETCH_HEAD
          if ($candidate -cne $expected) { throw 'Candidate identity differs' }
          if ($env:WALL_CONTRACT -ceq 'borrowed-dedup-retirement') {
            $baselineTree = git -C coaptic rev-parse 'HEAD^{tree}'
            if ($LASTEXITCODE -or $baselineTree -cne 'bca85f7b74b322a0f903005b18636d3a8414fe46') { throw 'Baseline tree differs' }
            $candidateTree = git -C coaptic rev-parse "$expected^{tree}"
            if ($LASTEXITCODE -or $candidateTree -cne '2ca30249b3a3d15f979716d01c0215f2a00a4127') { throw 'Candidate tree differs' }
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
      - name: Provision the existing process-inspection dependency
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check psutil==7.0.0
          if ($LASTEXITCODE) { throw 'Process-inspection dependency setup failed' }
      - name: Portable screen checks before native work
        shell: pwsh
        run: |
          Push-Location tools/benchmark
          python -B -m unittest -v test_admission_wall_screen test_admission_stage_b
          if ($LASTEXITCODE) { throw 'Portable screen checks failed' }
          Pop-Location
      - name: Build the pair and run the fixed wall-only screen
        shell: pwsh
        run: |
          # Remove only the pinned action's known transport/presentation defaults.
          # The runner retains strict refusal of unknown ambient build inputs.
          $setupDefaults = @{
            CARGO_TERM_COLOR = @('always')
            CARGO_REGISTRIES_CRATES_IO_PROTOCOL = @('sparse', 'git')
            CARGO_HTTP_MULTIPLEXING = @('false')
          }
          foreach ($name in $setupDefaults.Keys) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) {
              if ($value -cnotin $setupDefaults[$name]) { throw "Unexpected toolchain setup value for $name" }
              Remove-Item -LiteralPath "Env:$name"
            }
          }
          $command = if ($env:PROOF_ONLY -ceq 'true') { 'proof' } else { 'all' }
          python -B tools/benchmark/admission_wall_screen.py $command --contract $env:WALL_CONTRACT --core coaptic --expected-suite $env:SUITE_SHA --output "$env:RUNNER_TEMP/$env:WALL_ROOT"
          if ($LASTEXITCODE) { throw 'Screen refused, failed, or did not satisfy its frozen gates; retain evidence' }
      - name: Retain bounded raw observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.WALL_ARTIFACT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.WALL_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
