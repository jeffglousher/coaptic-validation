[package]
name = "coaptic-durable-host"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
coaptic-receipts = { path = "../../coaptic/tools/coaptic-receipts" }
coaptic = { path = "../../coaptic", default-features = false, features = ["std", "edhoc"] }
blake3 = "=1.8.7"

coaptic-esphome-probe = { path = "../esphome/rust", features = ["telemetry", "host", "library-only"] }
getrandom = "=0.3.4"
