[workspace]
[package]
name = "coaptic-ingress-loader"
version = "0.0.0"
edition = "2024"
publish = false
[target.'cfg(target_os = "linux")'.dependencies]
aya = "=0.14.0"
coaptic-ingress-classifier = { path = "../classifier" }
libc = "=0.2.191"
serde_json = "1"

[features]
syscall-trace = []

[[bin]]
name = "coaptic-syscall-loader"
path = "src/bin/syscall.rs"
required-features = ["syscall-trace"]
