[package]
name = "coaptic-esphome-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
oscore = ["qualification-no-std/oscore", "coaptic?/oscore", "dep:hmac", "dep:sha2"]
network = ["dep:coaptic", "dep:critical-section", "dep:chacha20", "dep:zeroize"]
async-network = ["network"]
host = ["coaptic?/std", "dep:getrandom"]
telemetry = ["network", "oscore", "coaptic?/edhoc"]
pairing = ["telemetry", "dep:zeroize", "dep:blake3"]
library-only = []
standalone = []

[dependencies]
qualification-no-std = { path = "../../../crates/qualification-no-std" }
coaptic = { path = "../../../coaptic", default-features = false, optional = true }
critical-section = { version = "1.2.0", optional = true }
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"], optional = true }

getrandom = { version = "=0.3.4", optional = true }
hmac = { version = "0.13.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, optional = true }
blake3 = { version = "=1.8.7", default-features = false, optional = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1.2.0", features = ["std"], optional = true }

[dev-dependencies]
coaptic-receipts = { path = "../../../coaptic/tools/coaptic-receipts" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "waveshare-peer"
path = "src/bin/waveshare_peer.rs"
required-features = ["network", "oscore", "host"]

[[bin]]
name = "checkpoint-cost"
path = "src/bin/checkpoint_cost.rs"
required-features = ["network", "oscore", "host"]
