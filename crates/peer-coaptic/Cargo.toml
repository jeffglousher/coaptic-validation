[package]
name = "peer-coaptic"
version = "0.1.0"
edition = "2024"
publish = false

[features]
cloud = ["coaptic/alloc"]

[[bin]]
name = "peer-coaptic-cloud"
path = "src/bin/cloud.rs"
required-features = ["cloud"]

[dependencies]
getrandom = "=0.3.4"
coaptic = { path = "../../coaptic", features = ["std", "oscore"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
webrtc-dtls = "0.12"
webrtc-util = "0.11"
async-trait = "0.1"
