[package]
name = "coaptic-plugtest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Multi-implementation CoAP#4 plugtest harness + pcap grader (not the library crate)"
repository = "https://github.com/jeffglousher/coaptic-validation"

[features]
default = []
# Test-only transport bridge avoids coap 0.28.1's legacy DTLS feature.
# Harness-only; the library has no DTLS dependency.
dtls = ["dep:webrtc-dtls", "dep:webrtc-util", "dep:rustls"]
# Pairwise OSCORE dogfood (`--oscore`). Library feature; no extra harness deps.
oscore = ["coaptic/oscore"]

[dependencies]
getrandom = "=0.3.4"
coaptic = { path = "../../coaptic", default-features = false, features = ["std"] }
coap = { version = "0.28", default-features = false }
coap-lite = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc-dtls = { version = "0.12", optional = true }
webrtc-util = { version = "0.11", optional = true, features = ["conn"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
async-trait = "0.1"

[[test]]
name = "interop"
path = "tests/interop.rs"

[[bin]]
name = "dogfood"
path = "src/bin/dogfood.rs"
doc = false
